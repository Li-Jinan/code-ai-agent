name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and build microservices
        run: bash ./mvnw -B -ntp -f code-ai-agent-microservice/pom.xml package

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code-ai-agent-frontend/package-lock.json
      - name: Install dependencies
        working-directory: code-ai-agent-frontend
        run: npm ci
      - name: Type check
        working-directory: code-ai-agent-frontend
        run: npm run type-check
      - name: Build
        working-directory: code-ai-agent-frontend
        run: npm run build-only
