# Public entry points for the production deployment on lijinan.cn.

server {
    listen 80;
    server_name ai.lijinan.cn preview.lijinan.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name lijinan.cn www.lijinan.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://ai.lijinan.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ai.lijinan.cn;

    ssl_certificate /usr/local/openresty/nginx/conf/ssl/lijinan.cn/live/lijinan.cn/fullchain.pem;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/lijinan.cn/live/lijinan.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name preview.lijinan.cn;

    ssl_certificate /usr/local/openresty/nginx/conf/ssl/lijinan.cn/live/lijinan.cn/fullchain.pem;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/lijinan.cn/live/lijinan.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:18083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name lijinan.cn www.lijinan.cn;

    ssl_certificate /usr/local/openresty/nginx/conf/ssl/lijinan.cn/live/lijinan.cn/fullchain.pem;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/lijinan.cn/live/lijinan.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://ai.lijinan.cn$request_uri;
}
