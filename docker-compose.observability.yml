services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: code-ai-agent-prometheus
    restart: unless-stopped
    depends_on:
      app-service:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${OBSERVABILITY_BIND_IP:-127.0.0.1}:${PROMETHEUS_PUBLIC_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:12.0.2
    container_name: code-ai-agent-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/generation-task-dashboard.json:/var/lib/grafana/dashboards/generation-task-dashboard.json:ro
    ports:
      - "${OBSERVABILITY_BIND_IP:-127.0.0.1}:${GRAFANA_PUBLIC_PORT:-3000}:3000"

volumes:
  prometheus-data:
  grafana-data:
